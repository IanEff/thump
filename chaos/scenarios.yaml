# Every row is one calibration datum's worth of work: what to break, what has
# to be true first, what the engine is expected to conclude, how long to let
# it settle, and what puts the rig back. A row with no restore is rejected at
# load — a harvest that cannot restore is a rig teardown with extra steps.
version: 1
# The rig this table is authored against. Every signalRef below has to be one
# that rig's rattle/watch.yaml can actually produce, and the fault paths are
# that rig's too — naming it here is what lets the offline guard check the
# join without any rig's name being compiled into the harvest package.
rig: thump-test
scenarios:
  - name: osd-down-accelerate
    domain: ceph
    # What rattle emits when this fires: "slo_burn" plus the watched object,
    # so it must be one of the object: entries in the rig's rattle/watch.yaml.
    # ceph-cluster rather than ceph-osd because accelerate-recovery's only
    # live proof settled on the ceph-health SLO, not the OSD latency one.
    signalRef: slo_burn:ceph-cluster
    fault:
      path: chaos/osd-pod-failure-accelerate.yaml
      apply: kubectl
    preconditions:
      - name: mon-osd-down-out-interval
        # Ceph waits 600s by default before marking a down OSD out, which is
        # longer than the whole harvest window; at 60 the degradation is real
        # within the run rather than after it.
        set: ceph config set global mon_osd_down_out_interval 60
        restore: ceph config set global mon_osd_down_out_interval 600
      - name: balancer-off
        # The balancer competes with the action under test for the same PGs.
        set: ceph balancer off
        restore: ceph balancer on
      - name: argocd-selfheal-off
        # ArgoCD reverts a scaled-to-0 operator in about a second, so any action
        # that pauses a reconciler needs self-heal off first or the pause does
        # not hold. preflight.sh already does this; the harvest has to own the
        # undo, or a cancelled run leaves six Applications un-self-healing.
        set: kubectl -n argocd patch application rook-ceph-operator --type merge -p {"spec":{"syncPolicy":{"automated":{"selfHeal":false}}}}
        restore: kubectl -n argocd patch application rook-ceph-operator --type merge -p {"spec":{"syncPolicy":{"automated":{"selfHeal":true}}}}
    expects:
      failureClass: redundancy_degraded
      contractRef: accelerate-recovery
      verdict: held           # blastTier high; a human blesses this one (D-10)
    settleWindow: 20m
    restore:
      path: chaos/osd-pod-failure-accelerate.yaml
      apply: kubectl-delete

  - name: cart-failure
    domain: otel-demo
    # cart-availability watches object: cart; the SLI reads checkout's
    # rpc_client series toward CartService, but the fingerprint is the
    # watched object's, not the emitting service's.
    signalRef: slo_burn:cart
    fault:
      path: chaos/flagd-cart-failure.sh
      apply: exec
      args: [inject]
    expects:
      failureClass: service_failure
      contractRef: disable-cart-failure
      verdict: approved       # act_reversible; auto-approves
    settleWindow: 15m
    restore:
      path: chaos/flagd-cart-failure.sh
      apply: exec
      args: [restore]
