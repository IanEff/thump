name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: fmt-check
        run: task fmt-check

      - name: vet
        run: task vet

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: vulncheck
        run: task vulncheck

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Chart lint (kubeconform)
        run: task chart-lint

      # Race detector runs locally via `task race`, not here — this gate
      # runs goleak's TestMain() in every package instead, which is cheaper
      # to run on every push and catches goroutine leaks before deployment.
      - name: test
        run: task test

      - name: coverage
        run: task coverage
        continue-on-error: true

      - name: build
        run: task build
