name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: arduino/setup-task@v3
        with:
          version: 3.x

      - name: fmt-check
        run: task fmt-check

      - name: vet
        run: task vet

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: vulncheck
        run: task vulncheck

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Cache Kubeconform Schemas
        uses: actions/cache@v4
        with:
          path: /tmp/kubeconform-cache
          key: kubeconform-schemas-${{ runner.os }}
          restore-keys: kubeconform-schemas-

      - name: Chart lint (kubeconform)
        run: task chart-lint

      - name: Setup promtool + yq
        run: |
          curl -sL https://github.com/prometheus/prometheus/releases/download/v3.13.2/prometheus-3.13.2.linux-amd64.tar.gz \
            | tar xz -C /tmp
          sudo install /tmp/prometheus-3.13.2.linux-amd64/promtool /usr/local/bin/promtool
          sudo curl -sL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: promql rule tests
        run: task test:promql

      # Race detector runs locally via `task race`, not here — this gate
      # runs goleak's TestMain() in every package instead, which is cheaper
      # to run on every push and catches goroutine leaks before deployment.
      - name: test
        run: task test

      - name: integration
        run: task integration

      - name: coverage
        run: task coverage
        continue-on-error: true

      - name: build
        run: task build
