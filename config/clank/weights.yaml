temporal: 0.3333333333333333
topological: 0.3333333333333333
historical: 0.3333333333333333
historicalHalfLife: 720h   # 30 days
# groundingNone/One/Many, causal: measured against the graded RCA suite
# (internal/rca, baseline 5/8) and left unchanged. Most propose rows land exactly at
# groundingOne (0.70) with no causal contribution — but "a real OSD pod-failure holds
# the rebalance" (internal/rca/table.go) carries topology/change data and reliably
# drives likelihoodOK true (causal fires on every run, since it's structural, not a
# model choice); on some runs the model also cites both metrics and loki on the same
# subject, reaching groundingMany — corroboration count is the model's own citation
# choice, so that tier is reachable but not guaranteed every run. Both terms are now
# confirmed to move confidence in the right direction; still no row's pass/fail verdict
# depends on where either one lands.
groundingNone: 0.3
groundingOne: 0.7
groundingMany: 1.0
causal: 0.5
recencyHalfLife: 30m
# Historical weights below are out of scope for tuning: CaseBase has no cross-restart
# persistence, so these score a store that's empty on every deploy. Revisit once
# case-base durability lands.
historicalAloneCap: 0.5
caseBaseBaseline: 0.9
negativeSignalPenalty: 0.2
