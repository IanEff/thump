# hiss refuses to start without this file (hiss.go:83-85, HISS_POLICY env
# var). Schema is hiss.Policy's YAML tags (policy.go:18) — field values here
# match the calmPolicy() fixture in internal/hiss/authority_test.go so the
# live run exercises the same posture the seam tests already prove out.
version: v1
floors:
  tier-1:
    dependency_saturation: 0.75
    resource_exhaustion: 0.75 # parity value with dependency_saturation, fixture-derived —
    # not yet calibrated against agent_proposal_confidence/agent_proposal_success_total.
    # This comment used to say that was a structural wait rather than a TODO, because
    # agent_proposal_success_total only populates on ResultSuccess/ResultFailure
    # (metrics.go recordCalibration) and thump was dry-run-only. THAT WAIT ENDED
    # 2026-07-16: thump grew a live executor (design-decisions.md D-8), and
    # recordCalibration has been firing on real settlements since — three on 2026-08-01
    # alone. The value is uncalibrated because nobody has looked, not because the data
    # cannot exist. What it needs is the observed distribution either side of a
    # candidate floor, which is a corpus mined off the sealed WAL, not a live counter.
    service_failure: 0.75 # parity value with dependency_saturation/resource_exhaustion.
    # Had no live confidence datum when this was written; it has one now —
    # disable-cart-failure proposed at 0.81, cleared this floor, auto-approved on
    # act_reversible and applied clean (2026-08-01). One datum is not a calibration,
    # but the class is no longer unobserved. Same corpus question as the row above.
    redundancy_degraded: 0.3 # SEED VALUE, lowered from 0.75 fixture parity 2026-07-18 to
    # unblock the first live approved+executed run on this class. Checked against the
    # mined WAL corpus (internal/clank/testdata/corpus/corpus.json): two distinct settled
    # incidents on this class, hold-rebalance at 0.8500 (partial_non_converging) and
    # accelerate-recovery at 0.8660 (success) — both above every candidate floor between
    # 0 and 0.85, so the corpus can't yet distinguish 0.3 from 0.75. disable-cart-failure
    # (0.8406, success) is service_failure, not this class, and isn't in this corpus at
    # all — its WAL segment never sealed. Two points a hair apart is a curve fit, not a
    # calibration; a floor moved on that basis would be worse than one left seeded.
    # Revisit once more incidents settle.
maxBand:
  tier-1: act_reversible
autoBand:
  tier-1: act_reversible
requireReversal: true
