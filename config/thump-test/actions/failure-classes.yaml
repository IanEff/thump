# The authored failure-class definitions — rig-invariant knowledge every
# site shares (unlike evidence-queries.yaml's query names, which vary by
# site — each profile can name their evidence differently). clank's
# seedPrompt renders this list so the model is told what a class means
# instead of inferring it from which action happens to be catalogued for it.
#
# This file IS the definitions: there is no Go copy behind it. Every
# proposal.FailureClass const must appear here with a non-empty description
# — a class the model may declare but was never given the meaning of is a
# class it will guess at — which is what
# TestShippedFailureClasses_DefineEveryFailureClass
# (internal/contract/load_test.go) fails on.
- class: dependency_saturation
  description: >-
    an upstream/downstream dependency is overloaded — the resource itself
    is fine; cite request-rate/failure-rate or upstream latency evidence,
    not just elevated latency on the resource.
- class: resource_exhaustion
  description: >-
    the resource ITSELF is out of headroom — cite capacity evidence (e.g.
    utilization/fullness). Ongoing recovery/backfill activity with healthy
    capacity is NOT resource_exhaustion.
- class: redundancy_degraded
  description: >-
    the cluster is running below its configured replication — placement
    groups are degraded or undersized, so stored data is at elevated loss
    risk until recovery restores the full replica count. Cite
    degraded/undersized PG evidence, not capacity fullness
    (resource_exhaustion) or request/failure rate (dependency_saturation).
- class: traffic_shift
  description: a legitimate change in load pattern, not a failure.
- class: service_failure
  description: >-
    a service is returning errors on its own request or RPC path independent of load or
    capacity — an injected fault or bad config, not a dependency being overloaded
    (dependency_saturation) or a resource running out of headroom (resource_exhaustion). Cite
    the service's own error-rate evidence. The fix is whatever the domain's own catalog offers
    for this class — disabling an injected fault (OTel demo) or shedding load off the failing
    path (acme) — never scaling or waiting on a dependency or resource, since that would be
    dependency_saturation or resource_exhaustion instead.
- class: unknown
  description: >-
    the evidence doesn't clearly support any of the above — call
    insufficient rather than forcing a label just because an action exists
    for it.
