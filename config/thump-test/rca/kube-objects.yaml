# kube-objects.yaml seeds the graded RCA suite's kube fake — the pods this
# rig's whir/evidence-queries.yaml subject rules need present to resolve a
# selector, never a claim about what's actually running on the live cluster.
pods:
  - name: rook-ceph-mon-a
    namespace: rook-ceph
    labels:
      app: rook-ceph-mon
    phase: Running
  # Ceph's subject rules carry no plane:, so one pod answers both the kube
  # and loki legs. The OSD pod carries both label vocabularies the index
  # declares for ceph-osd, so either authored selector resolves it.
  - name: rook-ceph-osd-0
    namespace: rook-ceph
    labels:
      app: rook-ceph-osd
      ceph_daemon_type: osd
    phase: Running
  - name: rook-ceph-rgw-a
    namespace: rook-ceph
    labels:
      app: rook-ceph-rgw
    phase: Running
  - name: rook-ceph-operator-0
    namespace: rook-ceph
    labels:
      app: rook-ceph-operator
    phase: Running
  - name: cart-0
    namespace: otel-demo
    labels:
      app.kubernetes.io/name: cart
    phase: Running
  - name: checkout-0
    namespace: otel-demo
    labels:
      app.kubernetes.io/name: checkout
    phase: Running
  - name: frontend-0
    namespace: otel-demo
    labels:
      app.kubernetes.io/name: frontend
    phase: Running
  - name: product-catalog-0
    namespace: otel-demo
    labels:
      app.kubernetes.io/name: product-catalog
    phase: Running
  - name: flagd-0
    namespace: otel-demo
    labels:
      app.kubernetes.io/name: flagd
    phase: Running
