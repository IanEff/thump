# The authored action catalog — the actions clank may propose and thump may
# execute, not a per-site fact (that's why this lives at config/actions/, not
# under a config/<site>/ profile). This file IS the catalog: there is no Go
# copy behind it, so an action added here is proposable with no Go edit, and
# an action deleted here can no longer be proposed or executed by anything.
#
# dependency_saturation carries one active catalogued remedy in this
# profile — acme-shed-load, below. throttle-non-critical-paths remains a
# demoted dead knob for the Ceph/RGW case it was authored for.
#
# contract.LoadCatalogFile binds each Precondition.OK by looking its Name up
# in a compiled contract.PreconditionRegistry — no contract below declares
# one, so the registry stays empty until an authored contract actually needs
# one.
#
# A typo here fails silently — an unrecognized failure class or blast tier
# unmarshals clean and leaves the action unreachable, so every contract is
# checked for reachability by TestShippedCatalog_EveryContractIsWellFormed
# (internal/contract/shipped_test.go). Executability is a separate claim:
# every contract's execution block must name a verb internal/actuate compiles
# a mechanism for, or the process refuses to start —
# TestShippedCatalog_EveryCatalogedActionIsActuatorBound goes red first.
- name: hold-rebalance
  # unknown deliberately NOT listed: mapping "I don't know" to a real action
  # gave the model an escape hatch to act instead of declining. A mismatch
  # between the declared class and the proposed action is now an auditable
  # decline (engine.go's errClassMismatch), not silence.
  applicableFailureClasses:
    - redundancy_degraded
  applicableTiers:
    - tier-1
  action:
    description: >-
      Hold Ceph recovery/rebalancing (osd set noout) while a node is
      transiently out, so the cluster doesn't thrash; reversible.
    scopeParameters:
      hold_minutes:
        min: 5
        max: 60
        default: 15
  blastTier: med
  reversal:
    method: release-rebalance
    fallback: page-oncall
    # noout is a hold, not a fix — left set after a win, it suppresses every
    # future OSD-out, so a met window still has to release it.
    restoreOnSuccess: true
  execution:
    forward:
      - {verb: exec, namespace: rook-ceph, selector: app=rook-ceph-tools, command: [ceph, osd, set, noout]}
    reverse:
      - {verb: exec, namespace: rook-ceph, selector: app=rook-ceph-tools, command: [ceph, osd, unset, noout]}
  successCriteria:
    metric: ceph_health
    target: HEALTH_OK
    window: 600000000000 # 10 * time.Minute, in nanoseconds
    severityQuery: severity_ceph_redundancy
    severityReductionPct: 0.7

- name: accelerate-recovery
  # The only high-blast action in the catalog, and one of two remedies for
  # redundancy_degraded: raising recovery concurrency buys durability by
  # spending client-serving I/O — a trade a human blesses, which is why it's
  # authored high. Reversible, so the shaper holds it rather than refusing it.
  applicableFailureClasses:
    - redundancy_degraded
  applicableTiers:
    - tier-1
  action:
    description: >-
      Raise OSD recovery/backfill concurrency (osd_max_backfills,
      osd_recovery_max_active) cluster-wide to restore full data
      replication faster, trading client I/O headroom for durability
      while placement groups are degraded; reversible.
    scopeParameters:
      backfill_concurrency:
        min: 4
        max: 32
        default: 16
  blastTier: high
  reversal:
    method: restore-recovery-defaults
    fallback: page-oncall
    # The tuning is temporary by nature — the authored ceph defaults are the
    # steady state, and a win that left the storage operator scaled to zero
    # would be worse than the no-op this replaces.
    restoreOnSuccess: true
  execution:
    forward:
      # Rook's operator reconciles ceph config back to its CR-declared values
      # within milliseconds of the mutation landing — pausing it is what
      # makes the ceph config set steps below stick for the window.
      - {verb: scale, namespace: rook-ceph, deployment: rook-ceph-operator, replicas: 0}
      # This cluster's default osd_op_queue=mclock_scheduler silently ignores
      # osd_max_backfills/osd_recovery_max_active unless this override is set
      # first — without it, the two sets below return exit 0 but never stick.
      - {verb: exec, namespace: rook-ceph, selector: app=rook-ceph-tools, command: [ceph, config, set, osd, osd_mclock_override_recovery_settings, "true"]}
      - {verb: exec, namespace: rook-ceph, selector: app=rook-ceph-tools, command: [ceph, config, set, osd, osd_max_backfills, "16"]}
      - {verb: exec, namespace: rook-ceph, selector: app=rook-ceph-tools, command: [ceph, config, set, osd, osd_recovery_max_active, "16"]}
    reverse:
      # Restore the knobs first, unpause the operator last, so Rook comes
      # back to find its declared values already in place.
      - {verb: exec, namespace: rook-ceph, selector: app=rook-ceph-tools, command: [ceph, config, rm, osd, osd_recovery_max_active]}
      - {verb: exec, namespace: rook-ceph, selector: app=rook-ceph-tools, command: [ceph, config, rm, osd, osd_max_backfills]}
      - {verb: exec, namespace: rook-ceph, selector: app=rook-ceph-tools, command: [ceph, config, set, osd, osd_mclock_override_recovery_settings, "false"]}
      - {verb: scale, namespace: rook-ceph, deployment: rook-ceph-operator, replicas: 1}
  successCriteria:
    metric: pgs_degraded
    target: "pgs_degraded == 0"
    window: 600000000000 # 10 * time.Minute, in nanoseconds
    severityQuery: severity_ceph_redundancy
    severityReductionPct: 0.8

# The OTel demo domain's two remedies (Wave 6, thump-test rig CLAUDE.md §8) —
# one per armed flagd flag. Both BlastLow (a single ConfigMap flip) and
# reversible, so both auto-band under hiss's tier-1 act_reversible ceiling.
# Scoped to service_failure only, never a Ceph class — see that class's
# description for why.
- name: disable-product-catalog-failure
  applicableFailureClasses:
    - service_failure
  applicableTiers:
    - tier-1
  action:
    description: >-
      Flip the productCatalogFailure flagd flag to "off" (merge-patch the
      flagd-config ConfigMap in otel-demo), clearing the injected GetProduct
      fault; reversible.
  blastTier: low
  reversal:
    method: enable-product-catalog-failure
    fallback: page-oncall
    holdOnMiss: true # this action IS the repair; its undo re-injects the fault
  execution:
    forward:
      - {verb: flagVariant, namespace: otel-demo, configMap: flagd-config, dataKey: demo.flagd.json, flag: productCatalogFailure, variant: "off"}
    reverse:
      - {verb: flagVariant, namespace: otel-demo, configMap: flagd-config, dataKey: demo.flagd.json, flag: productCatalogFailure, variant: "on"}
  successCriteria:
    metric: product_catalog_error_ratio
    target: "product_catalog_error_ratio < 0.02" # a decaying rate() never lands on exact 0
    window: 90000000000 # 90 * time.Second, in nanoseconds — strictly longer than the query's own rate(...[60s])
    severityQuery: severity_product_catalog_availability
    severityReductionPct: 0.9

- name: disable-cart-failure
  # cart is the ranker's two-eligible-action case (Wave 7): cartFailure is
  # also "fixable" by restarting the cart pod, but the fault is flag state,
  # not pod state, so only this action actually clears it.
  applicableFailureClasses:
    - service_failure
  applicableTiers:
    - tier-1
  action:
    description: >-
      Flip the cartFailure flagd flag to "off" (merge-patch the flagd-config
      ConfigMap in otel-demo), clearing the injected EmptyCart RPC fault
      (checkout -> CartService gRPC status 9); reversible.
  blastTier: low
  reversal:
    method: enable-cart-failure
    fallback: page-oncall
    holdOnMiss: true # this action IS the repair; its undo re-injects the fault
  execution:
    forward:
      - {verb: flagVariant, namespace: otel-demo, configMap: flagd-config, dataKey: demo.flagd.json, flag: cartFailure, variant: "off"}
    reverse:
      - {verb: flagVariant, namespace: otel-demo, configMap: flagd-config, dataKey: demo.flagd.json, flag: cartFailure, variant: "on"}
  successCriteria:
    metric: cart_error_ratio
    target: "cart_error_ratio < 0.02" # a decaying rate() never lands on exact 0
    window: 90000000000 # 90 * time.Second, in nanoseconds — strictly longer than the query's own rate(...[60s])
    severityQuery: severity_cart_availability
    severityReductionPct: 0.9

- name: restart-cart-pod
  # cart's plausible-but-wrong alternative (Wave 7's ranker exercise): real,
  # BlastLow, reversible — clears the gate on its own merits. What
  # discriminates it from disable-cart-failure is the honest
  # severityReductionPct below: cartFailure is flagd-controlled flag state,
  # not pod state, so recycling cart's pods doesn't touch the fault.
  applicableFailureClasses:
    - service_failure
  applicableTiers:
    - tier-1
  action:
    description: >-
      Roll the cart Deployment's pods (merge-patch a pod-template restart
      annotation, the same mechanism `kubectl rollout restart` uses);
      reversible in the sense that repeating it is harmless, but it does not
      clear a flagd-controlled fault.
  blastTier: low
  reversal:
    method: restart-cart-pod
    fallback: page-oncall
  execution:
    forward:
      - {verb: restart, namespace: otel-demo, deployment: cart}
    reverse:
      - {verb: restart, namespace: otel-demo, deployment: cart}
  successCriteria:
    metric: cart_error_ratio
    target: "cart_error_ratio < 0.02" # a decaying rate() never lands on exact 0
    window: 90000000000 # 90 * time.Second, in nanoseconds — strictly longer than the query's own rate(...[60s])
    severityQuery: severity_cart_availability
    severityReductionPct: 0.1

- name: throttle-non-critical-paths
  # Demoted dead knob — dependency_saturation carries no active remedy, so
  # this contract remains in the catalog as a demoted baseline only. Sheds the
  # rig's designated non-critical load (the s3 traffic generators) so the
  # saturated RGW path recovers headroom; reversible by restoring baseline.
  applicableFailureClasses:
    - dependency_saturation
  applicableTiers:
    - tier-1
  action:
    description: >-
      Scale the non-critical s3-traffic-generator deployment down to a
      floor, shedding synthetic load from the saturated RGW path;
      reversible by restoring the baseline replica count.
    scopeParameters:
      throttle_replicas:
        min: 0
        max: 5
        default: 2
  blastTier: med
  reversal:
    method: restore-traffic-baseline
    fallback: page-oncall
  execution:
    forward:
      - {verb: scale, namespace: default, deployment: s3-traffic-generator, replicas: 2}
    reverse:
      - {verb: scale, namespace: default, deployment: s3-traffic-generator, replicas: 10}
  successCriteria:
    metric: rgw_get_put_latency_ms
    target: "rgw_get_put_latency_ms < 150"
    window: 600000000000 # 10 * time.Minute, in nanoseconds
    severityQuery: severity_rgw_saturation
    severityReductionPct: 0.7

# The acme domain (docs/onboarding.md operator walkthrough) — a synthetic
# third domain, orthogonal to Ceph and OTel demo, standing in for "someone
# who has never onboarded a domain" following the doc's own example
# (test/onboarding/testdata/acme/actions/catalog.yaml) — except the failure
# class: the testdata fixture and config/thump-test both scope
# acme-shed-load to service_failure, but this profile's otel-demo trio
# (disable-product-catalog-failure, disable-cart-failure, restart-cart-pod)
# already claims service_failure here, and CHARTER.md's coverage row
# requires dev's two domains to share no failure class. Scoped to
# dependency_saturation instead — acme-db/acme-cache saturation, not
# acme-api's own request path — so a fault in one domain can never be
# matched by an action authored for the other.
#
# The remedy is scale-UP, not scale-down (phase AS Part 2). acme-db's
# fault-mode leak is a fixed total budget divided across live replicas
# (deploy/dev/manifests/acme.yaml), so scaling to more replicas genuinely
# spreads it thinner per pod; scaling to fewer only concentrates it. The
# success criterion moved off acme_api_error_ratio for the same reason the
# old mechanism could never converge — /fail hits acme-api's own request
# path and error ratio is replica-invariant — onto the saturation metric the
# action actually moves.
- name: acme-shed-load
  applicableFailureClasses:
    - dependency_saturation
  applicableTiers:
    - tier-1
  action:
    description: >-
      Relieve shared connection-pool saturation on acme-db by scaling
      acme-api up, spreading the fault-mode leak across more replicas;
      reversible.
    scopeParameters:
      serving_replicas:
        min: 1
        max: 10
        default: 5
  blastTier: low
  reversal:
    method: restore-acme-capacity
    fallback: page-oncall
  execution:
    forward:
      - {verb: scale, namespace: acme, deployment: acme-api, replicas: 5}
    reverse:
      - {verb: scale, namespace: acme, deployment: acme-api, replicas: 2}
  successCriteria:
    metric: acme_db_connections_saturation
    target: "acme_db_connections_saturation < 0.5"
    window: 90000000000 # 90 * time.Second, in nanoseconds — settle time after the scale
    # action, not a rate-window comparison: acme_db_connections_saturation is an instant
    # gauge (sum(active)/sum(max)), not a rate() over any window.
    severityQuery: severity_acme_api_availability
    severityReductionPct: 0.1
