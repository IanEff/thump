# evidence-queries.yaml — the dev environment's evidence surface. Trimmed
# from config/thump-test/whir/evidence-queries.yaml: the Ceph groups (1-7)
# and ArgoCD's group 6 are dropped outright — neither Ceph nor ArgoCD run in
# this env, so a query naming their series would just return empty and
# silently thin clank's evidence grounding. Group 8 (OTel demo) and group 9
# (acme, `domains.acme.enabled: true` in deploy/tilt-values-dev.yaml) both
# survive, renumbered together as the whole file.
#
# Two blocks: `queries`, the read-only PromQL the clank `metrics` tool
# exposes, and `subjects`, the coordinate rules the `loki` and `kube` tools
# resolve their citations through.
#
# subject: pins a query to the one topology node (from catalog-info.yaml) it's
# evidence about — internal/clank/gate.go's coherentSubject checks it against
# the signal's own frozen topology and fails CLOSED: an untagged query can
# still corroborate, but can never solely ground a proposal past the gate.
#
# ⚠️ VERIFY EVERY METRIC NAME ON THE TARGET CLUSTER BEFORE TRUSTING THIS.
# Run once against the dev cluster:
#   curl -s "$PROM_URL/api/v1/label/__name__/values" | tr ',' '\n' | grep -E 'slo:|kube_|app_frontend|rpc_client'
# and reconcile each query below against what's actually there.
version: v1
queries:
  # subject: tags every query below by the whir catalog-info.yaml entity it
  # concerns — what lets the gate tell "the model investigated an unrelated
  # app" from "the model found the actual cause" without restricting which
  # queries the model may run.
  - name: slo_burn_product_catalog
    query: slo:current_burn_rate:ratio{sloth_id="product-catalog-availability"}
    subject: product-catalog
  - name: slo_burn_cart
    query: slo:current_burn_rate:ratio{sloth_id="cart-availability"}
    subject: cart
  # severity_* pair action success windows check against — one sloth_id per
  # armed flag.
  - name: severity_product_catalog_availability
    query: slo:sli_error:ratio_rate5m{sloth_id="product-catalog-availability"}
    subject: product-catalog
  - name: severity_cart_availability
    query: slo:sli_error:ratio_rate5m{sloth_id="cart-availability"}
    subject: cart
  # Raw 0..1 error ratios — the same numerator/denominator AND window as each
  # SLO's own Sloth SLI (deploy/dev/manifests/slo-rules.yaml's rate5m rule),
  # for the model to cite directly and for disable-*-failure's
  # SuccessCriteria.Metric/Target to check against. A [60s] window, since
  # 2026-08-16: dev's loadgenerator carries LOCUST_USERS=150
  # (deploy/dev/values/otel-demo.yaml), pushing checkout->cart RPC to >=1
  # req/s, but Locust drives its task loop on a ~60s cadence — a [30s] window
  # lands on more ticks than not with zero samples inside it and reads NaN
  # even with real throughput and a fault actively injected (confirmed live,
  # 2026-08-16). Before LOCUST_USERS=150, checkout->cart ran ~0.07 req/s, and
  # even a 2m window starved (confirmed live, 2026-08-13: the model declined
  # a real cartFailure detection citing "cart_error_ratio returned no data"
  # while the fault was actively injected) — raising the load fixed the rate
  # problem but not the burst-cadence problem, which is what forced [60s]
  # rather than [30s]. Even at [60s] the window can still land on a
  # genuinely idle tick, giving errors=0 AND total=0 — 0/0 is NaN, not
  # absent, so the numerator's `or vector(0)` guard alone never catches it;
  # confirmed live, 2026-08-16, this NaN reached rattle's own burn-rate
  # computation (slo-rules.yaml's slo:current_burn_rate:ratio, a plain
  # division with no guard of its own) and crashed its WAL publish ("json:
  # unsupported value: NaN") — a real production outage. `clamp_min` on the
  # denominator reads a genuinely idle window as a healthy 0 instead of NaN,
  # with negligible effect at any real traffic level this rig runs.
  - name: product_catalog_error_ratio
    query: >-
      (sum(rate(app_frontend_requests_total{target="/api/products/OLJCESPC7Z",status="500"}[60s])) or vector(0))
      /
      clamp_min(sum(rate(app_frontend_requests_total{target="/api/products/OLJCESPC7Z"}[60s])) or vector(0), 1e-9)
    subject: product-catalog
  - name: cart_error_ratio
    query: >-
      (sum(rate(rpc_client_duration_milliseconds_count{service_name="checkout",rpc_service="oteldemo.CartService",rpc_grpc_status_code!="0"}[60s])) or vector(0))
      /
      clamp_min(sum(rate(rpc_client_duration_milliseconds_count{service_name="checkout",rpc_service="oteldemo.CartService"}[60s])) or vector(0), 1e-9)
    subject: cart
  # demo_pods_not_running spans the whole otel-demo namespace, not one
  # component — left untagged rather than pinned to a single subject that
  # would overclaim which node it's actually about.
  - name: demo_pods_not_running
    query: count(kube_pod_status_phase{namespace="otel-demo",phase!="Running"} == 1) or vector(0)

  - name: acme_api_error_ratio
    query: sum(rate(acme_api_requests_total{status="500"}[30s])) / sum(rate(acme_api_requests_total[30s]))
    subject: acme-api
  - name: acme_db_connections_saturation
    # sum, not max: acme-db (phase AS Part 2) models a fixed-capacity shared
    # pool whose fault-mode leak is divided across live replicas, so the
    # replica count only shows up in the aggregate — max(active)/max(max) is
    # replica-invariant (every pod reports the same per-pod share) and can
    # never move when acme-shed-load scales the Deployment.
    query: sum(acme_db_connections_active) / sum(acme_db_connections_max)
    subject: acme-db
  - name: slo_burn_acme_api
    query: slo:current_burn_rate:ratio{sloth_id="acme-api-availability"}
    subject: acme-api
  - name: severity_acme_api_availability
    query: slo:sli_error:ratio_rate5m{sloth_id="acme-api-availability"}
    subject: acme-api


# ── subject rules · the same claim, for the loki and kube tools ─────────────
# `subject:` above tags a named PromQL query. The `metrics` tool is the only
# one whose queries are named here — `loki` and `kube` take free-form
# coordinates from the model, so their tag is resolved from those coordinates
# instead: a rule matches when its namespace equals the query's and every
# label it names appears with the same value.
#
# ⚠️ THESE ARE FACTS ABOUT THIS CLUSTER, NOT ABOUT THUMP. Verify on the dev
# cluster:
#   kubectl get pods -n otel-demo --show-labels
#   curl -s "$LOKI_URL/loki/api/v1/label/service_name/values"
# otel-demo's pod label vocabulary (app.kubernetes.io/name) differs from its
# loki stream label (service_name), so each node gets two rules, one per
# plane — see the field comment on Plane in internal/subjects/subjects.go.
subjects:
  - subject: cart
    namespace: otel-demo
    plane: loki
    labels:
      service_name: cart
  - subject: checkout
    namespace: otel-demo
    plane: loki
    labels:
      service_name: checkout
  - subject: frontend
    namespace: otel-demo
    plane: loki
    labels:
      service_name: frontend
  - subject: product-catalog
    namespace: otel-demo
    plane: loki
    labels:
      service_name: product-catalog
  - subject: flagd
    namespace: otel-demo
    plane: loki
    labels:
      service_name: flagd

  - subject: cart
    namespace: otel-demo
    plane: kube
    labels:
      app.kubernetes.io/name: cart
  - subject: checkout
    namespace: otel-demo
    plane: kube
    labels:
      app.kubernetes.io/name: checkout
  - subject: frontend
    namespace: otel-demo
    plane: kube
    labels:
      app.kubernetes.io/name: frontend
  - subject: product-catalog
    namespace: otel-demo
    plane: kube
    labels:
      app.kubernetes.io/name: product-catalog
  - subject: flagd
    namespace: otel-demo
    plane: kube
    labels:
      app.kubernetes.io/name: flagd

  # Distributed traces in Tempo.
  - subject: cart
    namespace: otel-demo
    plane: traces
    labels:
      resource.service.name: cart
  - subject: checkout
    namespace: otel-demo
    plane: traces
    labels:
      resource.service.name: checkout
  - subject: frontend
    namespace: otel-demo
    plane: traces
    labels:
      resource.service.name: frontend
  - subject: product-catalog
    namespace: otel-demo
    plane: traces
    labels:
      resource.service.name: product-catalog
  - subject: flagd
    namespace: otel-demo
    plane: traces
    labels:
      resource.service.name: flagd

  # The demo names each service's Deployment after the service itself, which
  # is also the catalog entity name.
  - subject: cart
    namespace: otel-demo
    kind: Deployment
    name: cart
  - subject: checkout
    namespace: otel-demo
    kind: Deployment
    name: checkout
  - subject: frontend
    namespace: otel-demo
    kind: Deployment
    name: frontend
  - subject: product-catalog
    namespace: otel-demo
    kind: Deployment
    name: product-catalog
  - subject: flagd
    namespace: otel-demo
    kind: Deployment
    name: flagd
  - subject: flagd
    namespace: otel-demo
    kind: ConfigMap
    name: flagd-config

  # acme-api emits access and error logs to stdout/stderr.
  - subject: acme-api
    namespace: acme
    plane: loki
    labels:
      service_name: acme-api
  - subject: acme-api
    namespace: acme
    plane: kube
    labels:
      app: acme-api
  - subject: acme-api
    namespace: acme
    kind: Deployment
    name: acme-api

  # acme-api is absent from Tempo's service list (observed 2026-08-15); no traces rule authored.
