# replicas is 0/1 ONLY. The beats hold in-memory state (clank's ledger+casebase
# that the Learn edge shares, hiss/thump/rattle dedup logs). A 2nd replica makes
# JetStream load-balance the durable consumer across pods, each with its own empty
# ledger → outcomes land on the pod that never opened their set → learning dies
# silently (the A3 trap at cluster scale). Horizontal scale needs the state OUT of
# process first — a much later phase. Do not raise this to scale; it will break the
# loop, not speed it up.
replicas: 0

image:
  registry: ghcr.io/ianeff
  # tag is deliberately blank: the git SHA is stamped at deploy time
  # (`task images` / CI), never defaulted to `latest` — see
  # image-tagging-immutability. `helm template/install --set image.tag=<sha>`.
  tag: ""
  pullPolicy: IfNotPresent

# Switches whir and rattle profiles by cluster, while they're still hardwired
configProfile: ceph-lab

# VERIFY against the lab: `kubectl -n monitoring get svc` before committing.
prometheus:
  url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090

# gateway.enabled is false in the cluster's loki kustomization (singleBinary
# mode) — clients hit the loki service directly, not a loki-gateway. VERIFY
# against the lab: `kubectl -n logging get svc` before committing.
loki:
  url: http://loki.logging.svc.cluster.local:3100

# internal/notify/slack.Webhook POSTs a one-line digest of every held/
# escalated decision here (buildNotifier warns and runs with no notifier
# when this is empty). Nothing about the wire format is Slack-specific —
# any URL that accepts a POSTed {"text": ...} and answers 2xx works, which
# is what lets a dev rig point this at a plain echo receiver instead of a
# real incoming webhook.
notify:
  slackWebhookURL: ""

# ARGOCD_ENABLED wires ArgoChangeSource — clank's causal scorer has never
# executed on a rig without it, because every proposal.ChangeSnapshot it
# read was empty (phase-w-plan.md's headline finding). Both cluster
# profiles already run ArgoCD (its self-heal is what reverts an operator
# scale-to-0), so this defaults on rather than per-domain gated like
# domains.otelDemo/acme below.
argocd:
  enabled: true

# The ApprovalRequest surface: hiss opens one custom resource per held action
# and a human releases it with kubectl patch. What that buys over `calipers
# approve` is the approver's identity — an authenticated Kubernetes subject
# the API server records independently of thump, rather than a string an
# operator typed about themselves. Off means calipers is the only way to release
# a hold; hiss still runs, and still holds.
#
# approvers are the subjects granted patch rights. Empty means nobody can
# approve through kubectl — deliberately, since a default that granted this
# would hand out the authority the resource exists to constrain. Each entry is
# an RBAC subject: {kind: User|Group|ServiceAccount, name: ..., namespace: ...}.
approvalRequests:
  enabled: false
  approvers: []

# calipers harvest (internal/harvest) runs from an operator's own kubeconfig,
# never as an in-cluster Deployment — see rbac-harvest-chaosmesh.yaml's
# header for why that means RBAC here, not a NetworkPolicy. operators are
# the subjects bound into the three namespaced Roles (chaos-mesh, otel-demo,
# argocd) a harvest run needs; empty means nobody can run a live harvest
# scenario without their own out-of-band grant, same reasoning as
# approvalRequests.approvers above. Same subject shape:
# {kind: User|Group|ServiceAccount, name: ..., namespace: ...}.
harvest:
  enabled: false
  operators: []

# Empty by default. The deployment templates fan this one value out to two
# independent OTel init paths: internal/beat.Tracer (hand-rolled OTLP/gRPC,
# treats an empty OTEL_EXPORTER_OTLP_ENDPOINT as "unconfigured" and falls
# back to a noop Tracer) and the otelc compile-time auto-instrumentation
# layer (.otelc-build, wired via go.mod's `tool` directive — reads the same
# env var through go.opentelemetry.io/contrib/exporters/autoexport). The
# templates set OTEL_{TRACES,METRICS,LOGS}_EXPORTER=none when this is empty
# so otelc's layer goes quiet too, instead of falling back to autoexport's
# OTLP-spec default endpoint (localhost:4318) and retrying forever with
# nothing listening — a cluster with no OTel collector/Tempo deployed still
# starts clean on both layers.
#
# Set per-cluster as a full `http://host:port` URL (not bare host:port —
# otelc's autoexport needs a real URL to parse a host out of; the bare form
# used to silently mis-parse to an empty host and spam
# `Post "https:///v1/traces": http: no Host in request URL` every batch).
# The templates also set a fixed OTEL_EXPORTER_OTLP_PROTOCOL=grpc alongside
# it — not a second value to manage per cluster, just what makes autoexport
# agree with internal/beat.Tracer's own gRPC transport and Tempo's
# grpc-tempo-otlp Service port. VERIFY against the lab like
# prometheus.url/loki.url.
#
# The metrics half additionally sets OTEL_METRICS_EXPORTER=otlp-breaker
# rather than leaving autoexport on its own bare "otlp" default — internal/
# beat.otelmetrics.go registers that name with a metric.Exporter that stops
# retrying once a target proves (via a gRPC status code, not just "an error")
# it will never accept OTLP metrics, e.g. codes.Unimplemented against an
# endpoint with no MetricsService. Don't "simplify" this back to plain
# "otlp": that reintroduces a metrics-collection-interval log line, forever,
# on any endpoint that's traces-only.
tracing:
  endpoint: ""

# The key rides a Secret created out-of-band via the lab's existing
# SOPS-encrypted-secret flow — this chart only references it by name/key,
# it never contains or generates the plaintext key. `create: true` +
# `apiKey` is a local/Tilt-dev escape hatch ONLY — never set apiKey in a
# committed values file.
anthropic:
  secretName: thump-anthropic
  secretKey: api-key
  create: false
  apiKey: ""

# S3-compatible object store — every beat's broker path Require()s all four
# S3_* vars once NATS_URL is set (internal/config/config.go): the WAL
# shipper (every beat) and clank's S3Store transcript checkpoints. Same
# out-of-band posture as anthropic above: production expects secretName to
# already exist; create/the four value fields are a --set-only escape
# hatch, never a committed values file.
s3:
  secretName: thump-s3
  create: false
  endpoint: ""
  bucket: ""
  accessKey: ""
  secretKey: ""
  # tlsInsecureSkipVerify — never true outside the dev cluster profile
  # (deploy/tilt-values-dev.yaml only). It exists because S3Mock's HTTPS
  # port carries a bundled self-signed cert with no supported way to swap in
  # one signed by thump-ca — see internal/config/config.go's
  # S3TLSInsecureSkipVerify field comment for the full rationale.
  tlsInsecureSkipVerify: false

# THUMP_SEAL_KEY — every beat's broker path Require()s this once NATS_URL is
# set: the WAL shipper's EncryptingSink and clank's S3Store both seal under
# it before a PutObject. A 32-byte AES-256 key, base64. Unlike s3/anthropic
# above, this is internal-only key material, not an external credential — the
# chart self-provisions it on first install (secret.yaml's `lookup`-guarded
# block) rather than requiring out-of-band setup. `key` stays as a --set
# override for anyone importing existing key material.
seal:
  secretName: thump-seal
  key: ""

# executor unset defaults to dry — a thump deployed with no override renders
# and never acts. killSwitch.armed only seeds the mounted switch file, which
# is re-templated on every apply, so a redeploy always resets it to false.
thump:
  executor: dry
  killSwitch:
    armed: false

# otel-demo and acme are per-cluster-profile domains, not universal ones —
# only thump-test has those namespaces. Their RBAC (Role/RoleBinding) targets
# a fixed namespace with resourceNames pinned to that domain's app; unlike
# serviceMonitor/cilium below, chart-lint can't catch a mismatch here (the
# template is schema-valid whether or not the namespace exists) — it fails at
# apply time, on a live cluster, the first time you deploy this chart to a
# profile that lacks the domain. Off by default so ceph-lab/rook-gke/
# rook-gce-k3s still deploy clean; enable per-cluster in that profile's
# tilt-values file only when the domain is actually present.
#
# rookCeph defaults true, the opposite of the two above — every profile
# until dev (docs/dev-environment.md) has always had a rook-ceph namespace,
# so rbac-rook-ceph-{read,actuate}.yaml rendered unconditionally with no gate
# at all until now. dev is the first profile that genuinely has no Ceph;
# leaving the RBAC ungated there doesn't fail chart-lint (schema-valid
# either way, same blind spot as otelDemo/acme above) but does fail hard at
# apply time — found live 2026-08-11: Tilt's "uncategorized" bucket applies
# every object with no workload owner as one batch, so
# thump-rook-ceph-read/actuate's Role/RoleBinding failing on "namespaces
# \"rook-ceph\" not found" took thump-nats:configmap and nats-tls:certificate
# down with them, the same failure class the acme-rbac comment below
# describes — except this pair had no resource_deps guard to begin with, so
# unlike acme it never recovers on its own; it fails every reconcile,
# forever, until the cluster grows a rook-ceph namespace that dev never will.
domains:
  otelDemo:
    enabled: false
  acme:
    enabled: false
  rookCeph:
    enabled: true

# Cilium clusters give the kube-apiserver a reserved security identity that a
# plain NetworkPolicy ipBlock rule cannot match — so a live thump can't reach
# the apiserver to actuate (its client-go calls time out) unless a
# CiliumNetworkPolicy grants toEntities: kube-apiserver. Off by default so
# non-Cilium profiles (which lack the CRD) still render; enable per-cluster on
# Cilium rigs. Only meaningful alongside thump.executor: live.
cilium:
  apiserverEgress: false

# Per-beat resources (W0-2: one umbrella chart, per-beat values sections).
# Stage 0 confirmed real headroom; every beat starts small — the whole
# machine should cost less than one CSI sidecar.
beats:
  rattle:
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
  clank:
    # How far back Engine.Propose looks for a still-open set on the same
    # fingerprint before suppressing a redelivery — and, for a held set that
    # is never declined, how long it stays deduped before re-surfacing to
    # re-notify. 1h is the production default; shorten per-cluster for a live
    # run where waiting an hour to re-trigger is the bottleneck.
    dedupeWindow: 1h
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 100m, memory: 128Mi}
  hiss:
    # How long a Processed ApprovalRequest stays readable before the
    # controller's sweep reclaims it. 24h is the production default;
    # shorten per-cluster for a live run where etcd churn from held
    # requests is the bottleneck.
    approvalRetention: 24h
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
  thump:
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}

# The private PKI for ns/thump — R5's cert-manager ClusterIssuer, already
# live on the rig. Every beat's own leaf, the NATS server's, and the
# broker-bootstrap Job's all come from here (deploy/chart/thump/templates/
# certificates.yaml). duration/renewBefore short enough that a lab rig
# actually exercises renewal, not just in theory.
tls:
  issuerName: thump-ca
  duration: 2160h    # 90d
  renewBefore: 720h  # 30d

# The one-shot broker-bootstrap Job (R6c) — never a long-running pod, so its
# resources live outside beats.* above.
bootstrap:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 100m, memory: 64Mi}

# NATS jetstream message broker
nats:
  image:
    tag: "2.14.2-alpine"
  storageClass: "standard"
  storage: 2Gi
  jetstream:
    maxMemory: 256Mi
    maxFile: 2Gi
    # $JS_KEY, interpolated into nats.conf's jetstream{} block (R9a) — the
    # AES/ChaCha20 key JetStream seals message blocks and stream/consumer
    # metadata under on disk. Same self-provisioning posture as seal.key
    # above: internal-only key material, not an external credential, so the
    # chart generates it on first install (secret.yaml's `lookup`-guarded
    # block) instead of requiring out-of-band setup. `key` stays as a --set
    # override for anyone importing existing key material.
    secretName: nats-js-key
    key: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # The rest of this targets the control plane node for my noisy test cluster
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
# Per-beat /metrics (mTLS, Prometheus-scraped) and /healthz+/readyz
# (plaintext — kubelet's probes carry no client cert, so they live on their
# own port rather than behind the mTLS metrics listener).
metrics:
  port: 9090
  healthPort: 9091

# Each beat gets a service-<beat>.yaml Service exposing the metrics port
# unconditionally (cheap, no CRD dependency) — the ServiceMonitor on top of
# them is opt-in because the monitoring.coreos.com CRDs aren't guaranteed
# to exist on every cluster this chart targets; enabling it against a
# cluster without the Prometheus Operator installed fails at apply time,
# not at template time.
serviceMonitor:
  enabled: false
  interval: 30s
  # kube-prometheus-stack's Prometheus CR usually only picks up
  # ServiceMonitors matching its own serviceMonitorSelector (often a
  # release label) — set here per-cluster if the lab's Prometheus
  # requires one. VERIFY against the lab like prometheus.url/loki.url
  # above.
  additionalLabels: {}
