# Additive to rbac-otel-demo-actuate.yaml, kept in its own file for the same
# reviewability reason as rbac-rook-ceph-read.yaml/rbac-rook-ceph-actuate.yaml.
# Same shape as rbac-rook-ceph-read.yaml: the kube evidence tool's Client.List
# runs as thump:default, and evidence-queries.yaml's otel-demo plane: kube
# rules (cart/checkout/frontend/product-catalog/flagd) need get/list/watch on
# pods in this namespace to resolve. deployments/replicasets included for
# parity with rook-ceph, even though today's evidence rules only query pods.
#
# Gated on domains.otelDemo.enabled: the otel-demo namespace only exists on
# the thump-test cluster profile — see values.yaml's domains comment.
{{- if .Values.domains.otelDemo.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: thump-otel-demo-read
  namespace: otel-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: thump-otel-demo-read
  namespace: otel-demo
subjects:
  - kind: ServiceAccount
    name: default
    namespace: thump
roleRef:
  kind: Role
  name: thump-otel-demo-read
  apiGroup: rbac.authorization.k8s.io
{{- end }}
