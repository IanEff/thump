# The action catalog is per-profile: what a cluster is authorized to do is
# part of its own site config, same pattern as whir/rattle's ConfigMaps
# below. See configmap-whir.yaml for the .Files.Get / config-symlink note.
apiVersion: v1
kind: ConfigMap
metadata:
  name: thump-actions
  namespace: thump
  labels:
    {{- include "thump.labels" . | nindent 4 }}
data:
  catalog.yaml: |
{{ .Files.Get (printf "config/%s/actions/catalog.yaml" .Values.configProfile) | required (printf "no catalog for profile %s" .Values.configProfile) | indent 4 }}
  failure-classes.yaml: |
{{ .Files.Get (printf "config/%s/actions/failure-classes.yaml" .Values.configProfile) | required (printf "no failure-classes for profile %s" .Values.configProfile) | indent 4 }}
