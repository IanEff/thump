apiVersion: apps/v1
kind: Deployment
metadata:
  name: hiss
  namespace: thump
  labels: {{- include "thump.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "thump.beatSelectorLabels" (merge (dict "component" "hiss") .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "thump.beatSelectorLabels" (merge (dict "component" "hiss") .) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-hiss.yaml") . | sha256sum }}-{{ include (print $.Template.BasePath "/configmap-wal.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hiss
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: "{{ .Values.image.registry }}/thump-hiss:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            - name: health
              containerPort: {{ .Values.metrics.healthPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: METRICS_ADDR
              value: ":{{ .Values.metrics.port }}"
            - name: HEALTH_ADDR
              value: ":{{ .Values.metrics.healthPort }}"
            - name: NATS_URL
              value: "tls://nats.thump.svc:4222"
            - name: TLS_CERT_FILE
              value: /etc/thump/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/thump/tls/tls.key
            - name: TLS_CA_FILE
              value: /etc/thump/tls/ca.crt
            {{- if .Values.tracing.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp-breaker"
            {{- else }}
            - name: OTEL_TRACES_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            {{- end }}
            - name: WAL_DIR
              value: /var/thump/wal
            - name: WAL_CONFIG
              value: /etc/thump/wal/wal.yaml
            - name: APPROVALREQUESTS_ENABLED
              value: {{ .Values.approvalRequests.enabled | quote }}
            - name: APPROVALREQUEST_RETENTION
              value: {{ .Values.beats.hiss.approvalRetention | quote }}
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.secretName }}
                  key: endpoint
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.secretName }}
                  key: bucket
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.secretName }}
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.secretName }}
                  key: secret-key
            - name: THUMP_SEAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.seal.secretName }}
                  key: {{ .Values.seal.secretKey }}
            - name: HISS_POLICY
              value: /etc/thump/hiss/policy.yaml
          volumeMounts:
            - name: wal
              mountPath: /var/thump/wal
            - name: hiss-config
              mountPath: /etc/thump/hiss
            - name: wal-config
              mountPath: /etc/thump/wal
            - name: tls
              mountPath: /etc/thump/tls
          resources: {{- toYaml .Values.beats.hiss.resources | nindent 12 }}
      volumes:
        - name: wal
          # Plaintext on purpose: this copy dies with the pod. It's what calipers
          # and the debug-transcript skill read during an incident. The copy
          # that outlives the cluster (shipped to S3) is sealed — see
          # internal/beat.EncryptingSink.
          emptyDir: {}
        - name: hiss-config
          configMap:
            name: thump-hiss
        - name: wal-config
          configMap:
            name: thump-wal
        - name: tls
          secret:
            secretName: hiss-tls
