apiVersion: v1
kind: ConfigMap
metadata:
  name: thump-nats
  namespace: thump
  labels: {{- include "thump.labels" . | nindent 4 }}
data:
  nats.conf: |
    # single-node lab broker. Monitoring on :8222 for /healthz + port-forward.
    port: 4222
    http: 8222
    jetstream {
      store_dir: /data
      # unquoted: NATS's own config lexer parses the Mi/Gi suffix here, but
      # only outside a quoted string — quoted, it strconv.ParseInt's the raw
      # text and chokes on the trailing unit (verified against a real
      # nats-server -t).
      max_memory_store: {{ .Values.nats.jetstream.maxMemory }}
      max_file_store:   {{ .Values.nats.jetstream.maxFile }}
      cipher: chachapoly
      key: $JS_KEY
    }
    tls {
      cert_file: "/etc/nats/tls/tls.crt"
      key_file:  "/etc/nats/tls/tls.key"
      ca_file:   "/etc/nats/tls/ca.crt"
      # Require a client cert, verify it against ca_file, and map it to a
      # user below by SAN email — checked before the Subject DN, which has a
      # parser and therefore a history (CVE-2026-33248 was an impersonation
      # bug in exactly that parser).
      verify_and_map: true
      timeout: 3
    }
    # Every consuming beat also needs $JS.API.CONSUMER.INFO.THUMP.<durable>
    # and $JS.API.CONSUMER.MSG.NEXT.THUMP.<durable> — a pull consumer (no
    # DeliverSubject in EnsureTopology's ConsumerConfig) fetches messages by
    # requesting them over $JS.API, not by subscribing to the raw subject.
    # subscribe: _INBOX.> is the matching half: every request (JS.API or a
    # tracked js.Publish ack) replies on the caller's own ephemeral inbox,
    # and receiving a reply is a subscribe, not a publish.
    #
    # $JS.ACK.THUMP.<durable>.> is a second, separate publish grant a pull
    # consumer needs and the API-subject pair above doesn't cover: acking a
    # fetched message is nats.go publishing to the ack-reply subject stamped
    # on the delivered message, not a call through $JS.API at all. Missing
    # this one doesn't fail loudly at startup — EnsureTopology, the fetch,
    # and the bind all succeed — it only surfaces once a message actually
    # flows and the consumer can't acknowledge it, so nats-server logs a
    # Publish Violation per redelivery and the message never leaves
    # redelivery. Found live, R6e, 2026-07-27 — no hermetic test catches it
    # (R6d's drift test only walks broker.Subjects, not JetStream's own
    # ack/api subject space).
    #
    # Durables are internal/broker.DurableFor's own names — clank owns
    # "clank" (detections), "click" (outcomes, clank's own return edge), and
    # "clank-declines" (declines); hiss owns "hiss" (proposals) and
    # "his-approvals" (approvals); thump owns "thump" (decisions); rattle
    # owns none — first hop, nothing to consume, so no $JS.API/$JS.ACK grant
    # at all.
    authorization {
      users = [
        { user: "rattle@thump.svc"
          permissions: {
            publish:   { allow: ["thump.detections"] }
            subscribe: { allow: ["_INBOX.>"] }
          }
        }
        { user: "clank@thump.svc"
          permissions: {
            publish: {
              allow: [
                "thump.proposals",
                "thump.detections.dlq", "thump.outcomes.dlq", "thump.declines.dlq",
                "$JS.API.CONSUMER.INFO.THUMP.clank", "$JS.API.CONSUMER.MSG.NEXT.THUMP.clank", "$JS.ACK.THUMP.clank.>",
                "$JS.API.CONSUMER.INFO.THUMP.click", "$JS.API.CONSUMER.MSG.NEXT.THUMP.click", "$JS.ACK.THUMP.click.>",
                "$JS.API.CONSUMER.INFO.THUMP.clank-declines", "$JS.API.CONSUMER.MSG.NEXT.THUMP.clank-declines", "$JS.ACK.THUMP.clank-declines.>",
                # rebuild.go's fetchSubject mints a fresh, randomly-named
                # ephemeral consumer on each of these three subjects every
                # startup, to replay MemProposalLog/CaseBase state — same
                # pattern as hiss's rebuildHolds below, and the same reason
                # the wildcard token is needed instead of a fixed durable
                # name. Missing here until a real deploy crash-looped on it
                # (2026-08-02): the unit tests mock JetStream, so this gap
                # was never exercised live.
                "$JS.API.CONSUMER.CREATE.THUMP.*.thump.proposals",
                "$JS.API.CONSUMER.CREATE.THUMP.*.thump.outcomes",
                "$JS.API.CONSUMER.CREATE.THUMP.*.thump.declines",
                "$JS.API.CONSUMER.MSG.NEXT.THUMP.*", "$JS.ACK.THUMP.*.>"
              ]
            }
            subscribe: { allow: ["_INBOX.>"] }
          }
        }
        { user: "hiss@thump.svc"
          permissions: {
            publish: {
              allow: [
                # thump.approvals: the ApprovalRequestController's own
                # publish, once a human's kubectl patch is translated to an
                # Approval — hiss.go's approveHandler is what reads it back,
                # via the his-approvals consumer grant below. Found missing
                # live: the CR patched cleanly and got its approver stamped,
                # but the republish failed with a permissions violation
                # because only calipers (below) had ever been granted this
                # subject — this controller's own publish grant was never
                # added when it was wired in.
                "thump.decisions", "thump.approvals",
                "thump.proposals.dlq", "thump.approvals.dlq",
                "$JS.API.CONSUMER.INFO.THUMP.hiss", "$JS.API.CONSUMER.MSG.NEXT.THUMP.hiss", "$JS.ACK.THUMP.hiss.>",
                "$JS.API.CONSUMER.INFO.THUMP.his-approvals", "$JS.API.CONSUMER.MSG.NEXT.THUMP.his-approvals", "$JS.ACK.THUMP.his-approvals.>",
                # rebuildHolds (internal/hiss/rebuild.go) mints a fresh,
                # randomly-named ephemeral consumer on thump.decisions every
                # startup to replay PendingHolds — the wildcard token covers
                # that random name, unlike every other grant above which
                # names a fixed durable. All three of create, fetch (MSG.NEXT),
                # and ack are needed: FetchNoWait and msg.Ack() both address
                # the consumer by that same random name, not by filter subject.
                "$JS.API.CONSUMER.CREATE.THUMP.*.thump.decisions",
                "$JS.API.CONSUMER.MSG.NEXT.THUMP.*", "$JS.ACK.THUMP.*.>"
              ]
            }
            subscribe: { allow: ["_INBOX.>"] }
          }
        }
        { user: "thump@thump.svc"
          permissions: {
            publish: {
              allow: [
                # thump.held: HeldPub's leg for a hold verdict — records that
                # the fingerprint stays open, never declined. Found live
                # alongside the thump.approvals gap below: same cause, same
                # session — a permissions violation on every hold, masked
                # because HeldPub is a WALPublisher and the local WAL/S3 leg
                # still succeeds, so nothing crashed and nothing else
                # noticed a message never reached the stream.
                "thump.held",
                "thump.orders",
                "thump.outcomes",
                "thump.declines",
                "thump.decisions.dlq",
                "$JS.API.CONSUMER.INFO.THUMP.thump", "$JS.API.CONSUMER.MSG.NEXT.THUMP.thump", "$JS.ACK.THUMP.thump.>"
              ]
            }
            subscribe: { allow: ["_INBOX.>"] }
          }
        }
        # The broker-bootstrap Job's identity alone — created/updated once
        # per deploy, never by a beat. See internal/bootstrap and R6c.
        { user: "bootstrap@thump.svc"
          permissions: {
            publish:   { allow: ["$JS.API.>"] }
            subscribe: { allow: ["_INBOX.>"] }
          }
        }
        { user: "calipers@thump.svc"
          permissions: {
            publish: {
              allow: [
                "thump.approvals", "thump.decisions",
                # internal/harvest/nats.go's preflight liveness check
                # (js.AccountInfo, added for the dead-tunnel-vs-fake-timeout
                # fix) is a real request/reply round trip to $JS.API.INFO —
                # found live: every harvest row failed instantly with a
                # permissions violation on this bare subject, masked as
                # ErrBrokerUnreachable since that's the same error the check
                # is designed to raise on an actually-dead tunnel.
                "$JS.API.INFO",
                # calipers harvest watches thump.outcomes/thump.proposals
                # through its own ordered, ephemeral consumers
                # (internal/harvest/nats.go's watchSubject) rather than
                # binding clank's "click" or hiss's "hiss" durable — a
                # second reader on either would split deliveries with
                # production learning. jetstream.OrderedConsumer's
                # AckPolicy is AckNone (confirmed against
                # nats.go@v1.52.0's ordered.go), so this pair alone would
                # need no $JS.ACK grant.
                "$JS.API.CONSUMER.CREATE.THUMP.*.thump.outcomes",
                "$JS.API.CONSUMER.CREATE.THUMP.*.thump.proposals",
                # harvest's Lane A terminal-state watchers (Settle selects
                # across outcomes/declines/held so a decline or hold is
                # terminal, not a settle timeout) — missing this pair makes
                # every harvest run fail with "ordered consumer thump.declines:
                # context deadline exceeded" on its first decline/held row,
                # indistinguishable from a real decline until read here.
                "$JS.API.CONSUMER.CREATE.THUMP.*.thump.declines",
                "$JS.API.CONSUMER.CREATE.THUMP.*.thump.held",
                # internal/incident.SnapshotBroker rebuilds the operator's
                # read model from all four subjects via
                # internal/broker.DrainSubject, whose consumer is
                # AckExplicitPolicy — unlike harvest's ordered watchers
                # above, this one does need the matching $JS.ACK grant
                # below. Found live: calipers incidents failed outright
                # with a permissions violation on thump.detections before
                # this pair was added, since SnapshotBroker landed after
                # the harvest-only grants above did.
                "$JS.API.CONSUMER.CREATE.THUMP.*.thump.detections",
                "$JS.API.CONSUMER.CREATE.THUMP.*.thump.decisions",
                "$JS.API.CONSUMER.MSG.NEXT.THUMP.*", "$JS.ACK.THUMP.*.>"
              ]
            }
            subscribe: { allow: ["_INBOX.>"] }
          }
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: thump
  labels: {{- include "thump.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: thump
    app.kubernetes.io/component: nats
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
    - { name: monitor, port: 8222, targetPort: 8222 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: thump
  labels: {{- include "thump.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: nats
  selector:
    matchLabels:
      app.kubernetes.io/name: thump
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thump
        app.kubernetes.io/component: nats
    spec:
      # THE PIN: Inject the nodeSelector and tolerations from values.yaml
      nodeSelector: {{- toYaml .Values.nats.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.nats.tolerations | nindent 8 }}

      containers:
        - name: nats
          image: "nats:{{ .Values.nats.image.tag }}"
          args: ["-c", "/etc/nats/nats.conf"]
          env:
            # nats-server's config lexer interpolates $JS_KEY into the
            # jetstream{} block's `key:` line at startup — the value never
            # touches the ConfigMap, only the Secret this env var reads.
            - name: JS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nats.jetstream.secretName }}
                  key: key
          ports:
            - { containerPort: 4222, name: client }
            - { containerPort: 8222, name: monitor }
          volumeMounts:
            - { name: config, mountPath: /etc/nats }
            - { name: data, mountPath: /data }
            - { name: tls, mountPath: /etc/nats/tls }
          readinessProbe:
            httpGet: { path: /healthz, port: 8222 }
            initialDelaySeconds: 2
          resources: {{- toYaml .Values.nats.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: thump-nats }
        - name: tls
          secret: { secretName: nats-tls }

  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        # The local-path storage class handles carving out the host path
        storageClassName: {{ .Values.nats.storageClass | quote }}
        resources: { requests: { storage: {{ .Values.nats.storage | quote }} } }
