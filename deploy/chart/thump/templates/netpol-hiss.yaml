apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hiss-egress
  namespace: thump
  labels: {{- include "thump.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "thump.beatSelectorLabels" (merge (dict "component" "hiss") .) | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: thump
              app.kubernetes.io/component: nats
      ports:
        - protocol: TCP
          port: 4222
    # s3mock (Tiltfile, dev only) is the in-cluster WAL/transcript store this
    # profile substitutes for a real S3-compatible bucket — deploy/dev/
    # manifests/s3mock.yaml. Its HTTPS port is 9191, not 443, so the
    # ipBlock:0.0.0.0/0:443 leg below doesn't reach it; same precedent as
    # thump-notify-echo's pod-selector leg in netpol-thump.yaml — a no-op
    # selector on every profile where this pod doesn't exist.
    - to:
        - podSelector:
            matchLabels:
              app: s3mock
      ports:
        - protocol: TCP
          port: 9191
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tracing
      ports:
        - protocol: TCP
          port: 4317
    # A plain NetworkPolicy has no hostname-match primitive (that's Cilium's
    # toFQDNs, which this chart deliberately doesn't require) — this widens
    # the intended "storage.googleapis.com only" pin (WAL shipping via
    # internal/publish, wired through internal/beat) to any HTTPS destination.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
