# hiss creates one ApprovalRequest per hold, watches for a human's patch, and
# sweeps the resource once it is decided and past its retention — the sealed
# WAL is the audit record, so leaving one object per hold in etcd forever buys
# nothing. It never patches spec: the human's decision is the only thing that
# writes there.
{{- if .Values.approvalRequests.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: thump-hiss-approvalrequests
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["thump.dev"]
    resources: ["approvalrequests"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["thump.dev"]
    resources: ["approvalrequests/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: thump-hiss-approvalrequests
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: thump-hiss-approvalrequests
  apiGroup: rbac.authorization.k8s.io
{{- end }}
