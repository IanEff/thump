{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: thump
  namespace: thump
  labels: {{- include "thump.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # No component label here on purpose — this is the one selector meant to
  # match all four service-<beat>.yaml Services at once (each already
  # carries thump.labels plus its own component label; matching only the
  # shared name/instance pair is what makes one ServiceMonitor cover all
  # four without four near-identical copies).
  selector:
    matchLabels: {{- include "thump.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - thump
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scheme: https
      tlsConfig:
        ca:
          secret:
            name: prometheus-tls
            key: ca.crt
        cert:
          secret:
            name: prometheus-tls
            key: tls.crt
        keySecret:
          name: prometheus-tls
          key: tls.key
        # Each beat's server leaf (certificates.yaml's ranged block) carries
        # no DNS/IP SAN — identity on this rig is asserted by chain trust
        # (RequireAndVerifyClientCert) plus the CN/SAN-email pair NATS reads
        # for its own authz, not by hostname verification, and Endpoints-role
        # scraping dials pod IPs a SAN could never list anyway. insecureSkipVerify
        # only waives Prometheus's check of the server's identity; the beat
        # still refuses the handshake if Prometheus's own cert (above) doesn't
        # chain to thump-ca.
        insecureSkipVerify: true
{{- end }}
