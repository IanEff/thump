# Tilt dev-loop overrides for the thump-test cluster — Wave 7's addition to
# CLUSTERS, sibling to deploy/tilt-values-rook-gce-k3s.yaml (thump-test is
# that rig's replacement: same GCE/k3s/Cilium substrate, Ceph kept, the OTel
# demo added alongside it as a second orthogonal domain — thump-test repo
# CLAUDE.md §1). `tilt up -- --cluster=thump-test` picks this file.
#   - configProfile: thump-test selects config/thump-test/ (both domains'
#     watch/topology/state/evidence queries, Wave 6) — without it clank/
#     rattle reason over a phantom topology, same rule every site profile
#     follows.
#   - prometheus.url: thump-test runs the identical kube-prometheus-stack
#     setup rook-gce-k3s does (releaseName "prometheus", namespace
#     monitoring) — confirmed live via `kubectl --context thump-test -n
#     monitoring get svc`, same Service name/port.
#   - loki.url: no override, same reasoning as rook-gce-k3s's file — the
#     chart default already matches this rig's Loki (SingleBinary, gateway
#     disabled, namespace logging), ported verbatim from that rig.
#   - nats.storageClass: thump-test's k3s ships the same built-in
#     "local-path" class rook-gce-k3s does (confirmed live: `kubectl
#     --context thump-test get storageclass` — no "standard" class here
#     either) — control-plane node affinity stays at chart default for the
#     same reason (a real k3s server node, schedulable).
#   - tracing.endpoint: points at the OTel Collector
#     (otel-collector-opentelemetry-collector, namespace tracing), not
#     straight at Tempo — confirmed live via `kubectl --context thump-test -n
#     tracing get svc` (2026-08-01). Tempo only implements the OTLP traces
#     service; pointing metrics at it directly is what produced `failed to
#     upload metrics: ... Unimplemented` on every beat, forever. The
#     collector already runs both pipelines the rig needs: traces forward
#     unchanged to tempo.tracing.svc.cluster.local:4317 (its own otlp
#     exporter), and metrics land via its prometheus exporter (:8889) behind
#     a ServiceMonitor that's already deployed and picked up cluster-wide
#     (same `serviceMonitorSelectorNilUsesHelmValues: false` posture as this
#     file's own `serviceMonitor.enabled` block below) — no new
#     NetworkPolicy/CiliumNetworkPolicy needed, since the existing
#     tracing-namespace egress rule already covers this Service on the same
#     port (4317). Written as a full `http://host:port` URL, not bare
#     host:port — the deployment templates hand this same value to two
#     independent OTel exporters (internal/beat/trace.go's hand-rolled one
#     and the otelc auto-export layer) and only the URL form parses
#     correctly for both.
#   - cilium.apiserverEgress: thump-test runs Cilium (confirmed live), same
#     as every other GCE-based profile — the live executor needs the
#     CiliumNetworkPolicy to reach the apiserver.
replicas: 1

image:
  registry: "ghcr.io/ianeff"
  # Placeholder — Tilt matches on registry+repo (not tag) and rewrites this
  # to its own content-addressed tag on every build, so the literal value
  # here never actually reaches the cluster.
  tag: "dev"

configProfile: thump-test

approvalRequests:
  enabled: true
  approvers:
    - kind: User
      name: system:admin

# Both domains live only on this profile — see values.yaml's domains
# comment for why this can't just render unconditionally everywhere.
domains:
  otelDemo:
    enabled: true
  acme:
    enabled: true

prometheus:
  url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090

nats:
  storageClass: local-path

# Same posture as rook-gce-k3s's file: this rig's kube-prometheus-stack
# Operator runs with an empty serviceMonitorSelector
# (applications/infrastructure/prometheus/values.yaml,
# serviceMonitorSelectorNilUsesHelmValues: false, no selector set), so any
# ServiceMonitor this chart creates is picked up cluster-wide with no extra
# labeling needed.
serviceMonitor:
  enabled: true

tracing:
  endpoint: http://otel-collector-opentelemetry-collector.tracing.svc.cluster.local:4317

cilium:
  apiserverEgress: true

# Points at the Tiltfile's thump-notify-echo fixture (cluster_name ==
# "thump-test" gate, below the CLUSTERS table), not a real Slack incoming
# webhook — phase-af-cut-not-clobber.md Step 0c. slack.Webhook only cares
# that the URL accepts a POSTed {"text": ...} and answers 2xx, so an echo
# receiver proves the wire format; read its logs (`kubectl --context
# thump-test -n thump logs deploy/thump-notify-echo`) to see the digest.
notify:
  slackWebhookURL: http://thump-notify-echo.thump.svc.cluster.local:8080/

# ⚠️ TEMPORARY — arm-live block for the Phase-I live-proof run on thump-test
# (2026-07-20). Remove after the run. Same shape as rook-gce-k3s's I-live v2
# block: executor: live lets thump actually merge-patch the flagd ConfigMap;
# dedupeWindow shortened to 10m so a held/stuck fingerprint can't block
# re-detection for an hour and eat the session.
thump:
  executor: live
  killSwitch:
    armed: true
beats:
  clank:
    dedupeWindow: 10m
