            lab: dev
            sloth_id: acme-api-availability
            sloth_service: acme-api
            sloth_slo: availability
          record: slo:time_period:days
        - expr: |
            slo:sli_error:ratio_rate5m{sloth_id="acme-api-availability", sloth_service="acme-api", sloth_slo="availability"}
            / on(sloth_id, sloth_slo, sloth_service) group_left
            slo:error_budget:ratio{sloth_id="acme-api-availability", sloth_service="acme-api", sloth_slo="availability"}
          labels:
            domain: acme
            lab: dev
            sloth_id: acme-api-availability
            sloth_service: acme-api
            sloth_slo: availability
          record: slo:current_burn_rate:ratio
        - expr: |
            slo:sli_error:ratio_rate30d{sloth_id="acme-api-availability", sloth_service="acme-api", sloth_slo="availability"}
            / on(sloth_id, sloth_slo, sloth_service) group_left
            slo:error_budget:ratio{sloth_id="acme-api-availability", sloth_service="acme-api", sloth_slo="availability"}
          labels:
