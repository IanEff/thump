# Hand-authored PrometheusRule for the local thump dev environment — no
# Sloth operator runs here, same as the rig: neither
# ~/projects/ceph/thump-test nor this env run Sloth itself, they commit its
# *generated* output. These nine rule groups are extracted verbatim (only
# `lab: thump-test` -> `lab: dev`, nothing else) from
# ~/projects/ceph/thump-test/applications/infrastructure/sloth/prometheusrule.yaml
# (sli+meta recordings and alerts), covering the three SLOs config/dev/rattle/watch.yaml watches:
# product-catalog-availability, cart-availability, and acme-api-availability.
#
# The meta-recordings groups are what matter most: they emit
# slo:current_burn_rate:ratio{sloth_id=...} — the exact series
# internal/rattle/source.go:59 queries by sloth_id. Without this rule
# object, rattle has nothing to detect against, full stop.
#
# Each SLO's rate5m sli recording queries a [60s] range, not [5m], since
# 2026-08-16 — dev's loadgenerator carries LOCUST_USERS=150 (deploy/dev/
# values/otel-demo.yaml), but Locust drives its task loop on a ~60s cadence:
# a [30s] window lands on more ticks than not with zero samples inside it
# and reads NaN even with real >=1 req/s throughput and a fault actively
# injected — confirmed live, 2026-08-16. [60s] is the shortest range that
# reliably spans at least one Locust tick. The record name and sloth_window
# label carry the gap deliberately: the name is what slo:current_burn_rate:ratio
# and internal/rattle read by, so it stays put even though the range it now
# selects is longer than its own name implies.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sloth-generated-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/component: SLO
    app.kubernetes.io/managed-by: sloth
spec:
  groups:
    - name: sloth-slo-sli-recordings-product-catalog-availability
      rules:
        - expr: |
            (sum(rate(app_frontend_requests_total{target="/api/products/OLJCESPC7Z",status="500"}[60s])) or vector(0))
            /
            (sum(rate(app_frontend_requests_total{target="/api/products/OLJCESPC7Z"}[60s])))
          labels:
            domain: otel-demo
            lab: dev
            sloth_id: product-catalog-availability
            sloth_service: product-catalog
            sloth_slo: availability
            sloth_window: 60s
          record: slo:sli_error:ratio_rate5m
        - expr: |
            (sum(rate(app_frontend_requests_total{target="/api/products/OLJCESPC7Z",status="500"}[30m])) or vector(0))
            /
            (sum(rate(app_frontend_requests_total{target="/api/products/OLJCESPC7Z"}[30m])))
          labels:
            domain: otel-demo
            lab: dev
            sloth_id: product-catalog-availability
            sloth_service: product-catalog
            sloth_slo: availability
            sloth_window: 30m
          record: slo:sli_error:ratio_rate30m
        - expr: |
            (sum(rate(app_frontend_requests_total{target="/api/products/OLJCESPC7Z",status="500"}[1h])) or vector(0))
            /
            (sum(rate(app_frontend_requests_total{target="/api/products/OLJCESPC7Z"}[1h])))
          labels:
            domain: otel-demo
            lab: dev
            sloth_id: product-catalog-availability
            sloth_service: product-catalog
            sloth_slo: availability
            sloth_window: 1h
          record: slo:sli_error:ratio_rate1h
        - expr: |
            (sum(rate(app_frontend_requests_total{target="/api/products/OLJCESPC7Z",status="500"}[2h])) or vector(0))
            /
            (sum(rate(app_frontend_requests_total{target="/api/products/OLJCESPC7Z"}[2h])))
          labels:
            domain: otel-demo
            lab: dev
            sloth_id: product-catalog-availability
            sloth_service: product-catalog
            sloth_slo: availability
            sloth_window: 2h
          record: slo:sli_error:ratio_rate2h
        - expr: |
            (sum(rate(app_frontend_requests_total{target="/api/products/OLJCESPC7Z",status="500"}[6h])) or vector(0))
            /
            (sum(rate(app_frontend_requests_total{target="/api/products/OLJCESPC7Z"}[6h])))
          labels:
            domain: otel-demo
            lab: dev
            sloth_id: product-catalog-availability
            sloth_service: product-catalog
            sloth_slo: availability
            sloth_window: 6h
          record: slo:sli_error:ratio_rate6h
        - expr: |
            (sum(rate(app_frontend_requests_total{target="/api/products/OLJCESPC7Z",status="500"}[1d])) or vector(0))
            /
            (sum(rate(app_frontend_requests_total{target="/api/products/OLJCESPC7Z"}[1d])))
          labels:
            domain: otel-demo
            lab: dev
            sloth_id: product-catalog-availability
            sloth_service: product-catalog
            sloth_slo: availability
            sloth_window: 1d
          record: slo:sli_error:ratio_rate1d
        - expr: |
            (sum(rate(app_frontend_requests_total{target="/api/products/OLJCESPC7Z",status="500"}[3d])) or vector(0))
            /
            (sum(rate(app_frontend_requests_total{target="/api/products/OLJCESPC7Z"}[3d])))
          labels:
            domain: otel-demo
            lab: dev
            sloth_id: product-catalog-availability
            sloth_service: product-catalog
            sloth_slo: availability
            sloth_window: 3d
          record: slo:sli_error:ratio_rate3d
        - expr: |
            sum_over_time(slo:sli_error:ratio_rate5m{sloth_id="product-catalog-availability", sloth_service="product-catalog", sloth_slo="availability"}[30d])
            / ignoring (sloth_window)
            count_over_time(slo:sli_error:ratio_rate5m{sloth_id="product-catalog-availability", sloth_service="product-catalog", sloth_slo="availability"}[30d])
          labels:
            domain: otel-demo
            lab: dev
            sloth_id: product-catalog-availability
            sloth_service: product-catalog
            sloth_slo: availability
            sloth_window: 30d
          record: slo:sli_error:ratio_rate30d
    - name: sloth-slo-meta-recordings-product-catalog-availability
      rules:
        - expr: vector(0.99)
          labels:
            domain: otel-demo
            lab: dev
            sloth_id: product-catalog-availability
            sloth_service: product-catalog
            sloth_slo: availability
          record: slo:objective:ratio
        - expr: vector(1-0.99)
          labels:
            domain: otel-demo
            lab: dev
            sloth_id: product-catalog-availability
            sloth_service: product-catalog
            sloth_slo: availability
          record: slo:error_budget:ratio
        - expr: vector(30)
          labels:
            domain: otel-demo
            lab: dev
            sloth_id: product-catalog-availability
            sloth_service: product-catalog
            sloth_slo: availability
          record: slo:time_period:days
        - expr: |
            slo:sli_error:ratio_rate5m{sloth_id="product-catalog-availability", sloth_service="product-catalog", sloth_slo="availability"}
            / on(sloth_id, sloth_slo, sloth_service) group_left
            slo:error_budget:ratio{sloth_id="product-catalog-availability", sloth_service="product-catalog", sloth_slo="availability"}
          labels:
            domain: otel-demo
            lab: dev
            sloth_id: product-catalog-availability
            sloth_service: product-catalog
            sloth_slo: availability
          record: slo:current_burn_rate:ratio
        - expr: |
            slo:sli_error:ratio_rate30d{sloth_id="product-catalog-availability", sloth_service="product-catalog", sloth_slo="availability"}
            / on(sloth_id, sloth_slo, sloth_service) group_left
            slo:error_budget:ratio{sloth_id="product-catalog-availability", sloth_service="product-catalog", sloth_slo="availability"}
          labels:
            domain: otel-demo
            lab: dev
            sloth_id: product-catalog-availability
            sloth_service: product-catalog
            sloth_slo: availability
          record: slo:period_burn_rate:ratio
        - expr: 1 - slo:period_burn_rate:ratio{sloth_id="product-catalog-availability", sloth_service="product-catalog", sloth_slo="availability"}
          labels:
            domain: otel-demo
            lab: dev
            sloth_id: product-catalog-availability
            sloth_service: product-catalog
            sloth_slo: availability
          record: slo:period_error_budget_remaining:ratio
        - expr: vector(1)
          labels:
            domain: otel-demo
            lab: dev
            sloth_id: product-catalog-availability
            sloth_mode: cli-gen-k8s
            sloth_objective: "99"
            sloth_service: product-catalog
            sloth_slo: availability
            sloth_spec: sloth.slok.dev/v1
            sloth_version: 0.16.0
          record: sloth_slo_info
