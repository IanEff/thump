    - name: sloth-slo-alerts-acme-api-availability
      rules:
        - alert: AcmeAPIAvailabilitySLO
          annotations:
            summary: '{{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget burn rate is over expected.'
            title: (page) {{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget burn rate is too fast.
          expr: |
            (
                max(slo:sli_error:ratio_rate5m{sloth_id="acme-api-availability", sloth_service="acme-api", sloth_slo="availability"} > (14.4 * 0.01)) without (sloth_window)
                and
                max(slo:sli_error:ratio_rate1h{sloth_id="acme-api-availability", sloth_service="acme-api", sloth_slo="availability"} > (14.4 * 0.01)) without (sloth_window)
            )
            or
            (
                max(slo:sli_error:ratio_rate30m{sloth_id="acme-api-availability", sloth_service="acme-api", sloth_slo="availability"} > (6 * 0.01)) without (sloth_window)
                and
                max(slo:sli_error:ratio_rate6h{sloth_id="acme-api-availability", sloth_service="acme-api", sloth_slo="availability"} > (6 * 0.01)) without (sloth_window)
            )
          labels:
            severity: critical
            sloth_severity: page
        - alert: AcmeAPIAvailabilitySLO
          annotations:
            summary: '{{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget burn rate is over expected.'
            title: (ticket) {{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget burn rate is too fast.
          expr: |
            (
                max(slo:sli_error:ratio_rate2h{sloth_id="acme-api-availability", sloth_service="acme-api", sloth_slo="availability"} > (3 * 0.01)) without (sloth_window)
                and
                max(slo:sli_error:ratio_rate1d{sloth_id="acme-api-availability", sloth_service="acme-api", sloth_slo="availability"} > (3 * 0.01)) without (sloth_window)
            )
            or
            (
                max(slo:sli_error:ratio_rate6h{sloth_id="acme-api-availability", sloth_service="acme-api", sloth_slo="availability"} > (1 * 0.01)) without (sloth_window)
                and
                max(slo:sli_error:ratio_rate3d{sloth_id="acme-api-availability", sloth_service="acme-api", sloth_slo="availability"} > (1 * 0.01)) without (sloth_window)
            )
          labels:
            severity: warning
            sloth_severity: ticket

