            (sum(rate(rpc_client_duration_milliseconds_count{service_name="checkout",rpc_service="oteldemo.CartService"}[2h])))
          labels:
            domain: otel-demo
            lab: dev
            sloth_id: cart-availability
            sloth_service: cart
            sloth_slo: availability
            sloth_window: 2h
          record: slo:sli_error:ratio_rate2h
        - expr: |
            (sum(rate(rpc_client_duration_milliseconds_count{service_name="checkout",rpc_service="oteldemo.CartService",rpc_grpc_status_code!="0"}[6h])) or vector(0))
            /
