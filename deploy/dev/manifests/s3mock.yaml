# S3Mock — the dev profile's WAL/transcript durability layer (rigs use a
# real GCS/S3 bucket instead; see the Tiltfile's thump-s3-secret comment).
# Applied by the Tiltfile's s3mock local_resource (cluster=dev only), not
# by deploy/dev/bootstrap.sh — this is a single stateless Deployment+Service
# with no Helm chart, same posture as thump-notify-echo.
#
# COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS pre-creates thump-wal on
# startup — confirmed against adobe/S3Mock's own README (2026-08-11), not
# guessed. Ports 9090 (HTTP) and 9191 (HTTPS, S3Mock's own bundled
# self-signed cert) are also both confirmed there.
# RequireURL("S3_ENDPOINT", "http", "https") in internal/config/config.go
# means every beat dials 9090, declared plaintext rather than trusting an
# unauthenticated TLS session (I-16, docs/invariants.md); 9191 is exposed
# for convenience only (e.g. curl from a debug pod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3mock
  namespace: thump
spec:
  replicas: 1
  selector:
    matchLabels: {app: s3mock}
  template:
    metadata:
      labels: {app: s3mock}
    spec:
      containers:
        - name: s3mock
          image: adobe/s3mock:5.1.0
          ports:
            - containerPort: 9090
            - containerPort: 9191
          env:
            - name: COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS
              value: "thump-wal"
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: s3mock
  namespace: thump
spec:
  selector: {app: s3mock}
  ports:
    - name: http
      port: 9090
      targetPort: 9090
    - name: https
      port: 9191
      targetPort: 9191
