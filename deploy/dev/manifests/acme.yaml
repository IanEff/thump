# acme — a synthetic third domain, orthogonal to Ceph and the OTel demo.
# Ported from ~/projects/ceph/thump-test/applications/apps/acme/manifests.yaml
# for the local dev environment (deploy/dev/manifests/acme.yaml).
# Fully self-contained: a tiny Python HTTP server serves /metrics (Prometheus
# text format) and drives its own traffic against itself; a ConfigMap-mounted
# flag file (acme-fault-flag/target: "/" healthy, "/fail" faulted) is the
# fault control thump's chaos tooling flips. Three Services front the same pod
# under different names (api/db/cache) so up{job="acme-db"}/up{job="acme-cache"}
# populate for real via Prometheus's own per-target scrape health, matching
# the dependency shape declared in thump's config/dev/rattle/catalog-info.yaml.
#
# acme-db models a fixed-capacity shared connection pool, not a per-pod
# constant (phase AS Part 2). Under fault, every replica leaks its equal
# share of a fixed total budget — db_active = total_leak_budget // replicas
# — so scaling the Deployment up genuinely spreads the leak thinner per pod,
# and acme-shed-load's "scale up to relieve saturation" story is true rather
# than decorative. Each pod reads its own Deployment's live replica count
# from the Kubernetes API (its own SA token, granted `get` below) rather than
# a hardcoded number, so the metric tracks whatever thump actually did.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: acme-api
  namespace: acme
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: acme-api-self-read
  namespace: acme
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
    resourceNames: ["acme-api"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acme-api-self-read
  namespace: acme
subjects:
  - kind: ServiceAccount
    name: acme-api
    namespace: acme
roleRef:
  kind: Role
  name: acme-api-self-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: acme-api-server
  namespace: acme
data:
  server.py: |
    import http.server, json, re, threading, time, urllib.request

    TOTAL_LEAK_BUDGET = 190
    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    DEPLOYMENT_URL = (
        "https://kubernetes.default.svc/apis/apps/v1"
        "/namespaces/acme/deployments/acme-api"
    )

    state = {"200": 10000, "500": 50, "db_active": 10, "replicas": 2}
    target = {"path": "/"}

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/metrics":
                body = (
                    'acme_api_requests_total{status="200"} %d\n'
                    'acme_api_requests_total{status="500"} %d\n'
                    'acme_db_connections_active %d\n'
                    'acme_db_connections_max 100\n'
                ) % (state["200"], state["500"], state["db_active"])
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.end_headers()
                self.wfile.write(body.encode())
            elif self.path == "/fail":
                state["500"] += 1
                state["db_active"] = min(95, TOTAL_LEAK_BUDGET // max(1, state["replicas"]))
                self.send_response(500)
                self.end_headers()
            else:
                state["200"] += 1
                state["db_active"] = 10
                self.send_response(200)
                self.end_headers()

        def log_message(self, format, *args):
            if "/metrics" in (args[0] if args else ""):
                return
            super().log_message(format, *args)

    def driver():
        while True:
            try:
                urllib.request.urlopen("http://localhost:8000" + target["path"], timeout=2)
            except Exception:
                pass
            time.sleep(1)

    def flag_watcher():
        while True:
            try:
                with open("/flag/target") as f:
                    p = f.read().strip()
                    if p in ("/", "/fail"):
                        target["path"] = p
            except Exception:
                pass
            time.sleep(2)

    def replica_watcher():
        # Falls back to the last-known replica count on any error (missing
        # token, API unreachable, unexpected response shape) so a transient
        # control-plane hiccup never crashes the handler thread or the leak
        # calculation — it just goes stale until the next successful poll.
        try:
            with open(TOKEN_PATH) as f:
                token = f.read().strip()
        except Exception:
            token = None
        while True:
            if token:
                try:
                    req = urllib.request.Request(
                        DEPLOYMENT_URL,
                        headers={"Authorization": "Bearer " + token},
                    )
                    import ssl
                    ctx = ssl.create_default_context(cafile=CA_PATH)
                    with urllib.request.urlopen(req, timeout=2, context=ctx) as resp:
                        doc = json.loads(resp.read())
                        replicas = doc.get("spec", {}).get("replicas")
                        if isinstance(replicas, int) and replicas > 0:
                            state["replicas"] = replicas
                except Exception:
                    pass
            time.sleep(5)

    threading.Thread(target=driver, daemon=True).start()
    threading.Thread(target=flag_watcher, daemon=True).start()
    threading.Thread(target=replica_watcher, daemon=True).start()
    http.server.HTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: acme-fault-flag
  namespace: acme
data:
  target: "/"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-api
  namespace: acme
spec:
  replicas: 2
  selector:
    matchLabels:
      app: acme-api
  template:
    metadata:
      labels:
        app: acme-api
    spec:
      serviceAccountName: acme-api
      containers:
        - name: acme-api
          # Pinned by digest — every other image in this profile (k3s, the
          # ten Helm charts, s3mock) is pinned; a floating tag here was the
          # one place a laptop's Docker cache could silently drift.
          image: python:3.12-alpine@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df
          command: ["python3", "/srv/server.py"]
          ports:
            - containerPort: 8000
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 50m, memory: 64Mi}
          volumeMounts:
            - name: server-code
              mountPath: /srv
            - name: fault-flag
              mountPath: /flag
      volumes:
        - name: server-code
          configMap:
            name: acme-api-server
        - name: fault-flag
          configMap:
            name: acme-fault-flag
---
apiVersion: v1
kind: Service
metadata:
  name: acme-api
  namespace: acme
  labels:
    app: acme-api
    acme-role: api
spec:
  selector:
    app: acme-api
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: acme-db
  namespace: acme
  labels:
    app: acme-api
    acme-role: db
spec:
  selector:
    app: acme-api
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: acme-cache
  namespace: acme
  labels:
    app: acme-api
    acme-role: cache
spec:
  selector:
    app: acme-api
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: acme-api
  namespace: acme
spec:
  selector:
    matchLabels:
      acme-role: api
  namespaceSelector:
    matchNames: ["acme"]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
      relabelings:
        - targetLabel: job
          replacement: acme-api
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: acme-db
  namespace: acme
spec:
  selector:
    matchLabels:
      acme-role: db
  namespaceSelector:
    matchNames: ["acme"]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
      relabelings:
        - targetLabel: job
          replacement: acme-db
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: acme-cache
  namespace: acme
spec:
  selector:
    matchLabels:
      acme-role: cache
  namespaceSelector:
    matchNames: ["acme"]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
      relabelings:
        - targetLabel: job
          replacement: acme-cache
