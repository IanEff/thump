# template for `task dev:govern` (phase AS 0B.1) — substituted with envsubst,
# never applied as-is. Not part of the Helm chart and never rendered by
# Tilt's helm() call in tilt/deploy.Tiltfile: this Job is a one-shot debug
# tool the operator applies by hand, pointed at a single proposal.Set the
# operator already has (typically from `calipers transcript`'s replay-pair
# export), never at thump.proposals/thump.decisions/thump.outcomes or any
# WAL — it runs entirely inside its own scratch emptyDirs and exits.
#
# Reuses the real thump Deployment's ServiceAccount (default, in namespace
# thump — see rbac-acme-actuate.yaml et al., which bind that identity, not a
# name this Job invents) and the same ConfigMaps
# (deployment-thump.yaml:150-161), so a governed action actuates through the
# exact same RBAC the live beat has — never broader, never a stub. It does
# NOT reuse thump's NATS_URL, WAL, S3, or seal-key env — offline mode
# (internal/thump/thump.go's THUMP_INBOX/OUTBOX branch) never touches any of
# those, per internal/config.LoadThump(false)'s required-var set.
apiVersion: batch/v1
kind: Job
metadata:
  name: dev-govern-${RUN_ID}
  namespace: thump
  labels:
    app.kubernetes.io/component: dev-govern
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dev-govern
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # thump's own image is distroless (no shell, no cp) — copying the
        # operator-supplied Governed envelope out of its read-only ConfigMap
        # mount and into the writable /inbox emptyDir needs a real shell,
        # so this step alone runs a different image.
        - name: stage-input
          image: busybox:1.36
          command: ["sh", "-c", "cp /cm-input/*.yaml /inbox/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cm-input
              mountPath: /cm-input
            - name: inbox
              mountPath: /inbox
      containers:
        - name: govern
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: "${THUMP_IMAGE}"
          args: ["--once"]
          env:
            - name: THUMP_INBOX
              value: /inbox
            - name: THUMP_OUTBOX
              value: /outbox
            - name: ACTION_CATALOG
              value: /etc/thump/actions/catalog.yaml
            - name: THUMP_EXECUTOR
              value: "${THUMP_EXECUTOR}"
            - name: THUMP_KILLSWITCH
              value: /etc/thump/killswitch/switch.yaml
            - name: PROM_URL
              value: "${PROM_URL}"
            - name: EVIDENCE_QUERIES
              value: /etc/thump/whir/evidence-queries.yaml
            - name: OTEL_TRACES_EXPORTER
              value: "none"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
          volumeMounts:
            - name: inbox
              mountPath: /inbox
            - name: outbox
              mountPath: /outbox
            - name: actions-config
              mountPath: /etc/thump/actions
            - name: killswitch
              mountPath: /etc/thump/killswitch
            - name: whir-config
              mountPath: /etc/thump/whir
      volumes:
        - name: cm-input
          configMap:
            name: ${INPUT_CONFIGMAP}
        - name: inbox
          emptyDir: {}
        - name: outbox
          emptyDir: {}
        - name: actions-config
          configMap:
            name: thump-actions
        - name: killswitch
          configMap:
            name: thump-killswitch
        - name: whir-config
          configMap:
            name: thump-whir
