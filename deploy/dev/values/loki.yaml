# Loki (SingleBinary) for the local thump dev environment. Ported from
# ~/projects/ceph/thump-test/applications/infrastructure/loki/kustomization.yaml
# — only the storageClass changed (rook-ceph-block -> local-path). Gateway
# stays disabled: deploy/tilt-values-dev.yaml's loki.url (chart default,
# unset) already matches this SingleBinary Service name/port, same as the
# rig's own values comment notes for its profile.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 24h
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
gateway:
  enabled: false
resultsCache:
  enabled: false
chunksCache:
  enabled: false
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
