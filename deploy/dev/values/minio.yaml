# MinIO for the local thump dev environment — the one thing this env swaps
# for infrastructure the rigs get elsewhere. Neither rig runs MinIO: the
# thump-test/rook-gce-k3s rigs use a real GCS bucket + HMAC keypair (Tofu's
# storage.tf), deliberately off-cluster so chaos against Ceph can't take out
# thump's own WAL/transcript durability. There's no Ceph here to make that
# argument, and every beat's WAL shipper Require()s all four S3_* vars
# (internal/config), so an in-cluster S3-compatible store is the simplest
# stand-in. Chart: minio/minio (https://charts.min.io), standalone mode —
# no need for the distributed/erasure-coded mode a single dev node gets no
# benefit from.
mode: standalone

# Matches deploy/dev/bootstrap.sh's MinIO credentials, which
# deploy/tilt-values-dev.yaml's Tiltfile wiring reads to populate
# thump-s3-secret for the dev cluster profile only — see Tiltfile's
# dev-profile branch of the thump-s3-secret local_resource.
rootUser: thump-dev
rootPassword: thump-dev-secret

persistence:
  enabled: true
  storageClass: local-path
  size: 4Gi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 512Mi

service:
  type: ClusterIP
  port: 9000

consoleService:
  type: ClusterIP
  port: 9001

# No Ingress — reached via Tilt port_forward like everything else in this
# env, same posture as Grafana/Prometheus/Hubble.
ingress:
  enabled: false
consoleIngress:
  enabled: false
