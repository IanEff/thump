# OTel Collector for the local thump dev environment. Ported verbatim from
# ~/projects/ceph/thump-test/applications/infrastructure/otel-collector/kustomization.yaml
# — this is the collector thump's own beats (and the OTel demo, via
# OTEL_COLLECTOR_NAME) point tracing.endpoint at, NOT Tempo directly: Tempo
# only implements the OTLP traces service, and pointing metrics straight at
# it produces "failed to upload metrics: ... Unimplemented" on every beat,
# forever (learned live on the rig). This collector forwards traces to Tempo
# unchanged and exposes a prometheus exporter for metrics, which is what the
# chart's serviceMonitor.enabled below feeds to Prometheus.
mode: deployment
image:
  repository: "otel/opentelemetry-collector-contrib"
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 512Mi
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    jaeger:
      protocols:
        thrift_compact:
          endpoint: 0.0.0.0:6831
  processors:
    batch: {}
  connectors:
    servicegraph:
      dimensions: []
      store:
        ttl: 2s
        max_items: 1000
  exporters:
    otlp:
      endpoint: "tempo.tracing.svc.cluster.local:4317"
      tls:
        insecure: true
    prometheus:
      endpoint: "0.0.0.0:8889"
      resource_to_telemetry_conversion:
        enabled: true
  service:
    pipelines:
      traces:
        receivers: [otlp, jaeger]
        processors: [batch]
        exporters: [otlp, servicegraph]
      metrics:
        receivers: [otlp, servicegraph]
        processors: [batch]
        exporters: [prometheus]
ports:
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP
serviceMonitor:
  enabled: true
  metricsEndpoints:
    # 10s, not the global scrapeInterval's 30s — this is where otel-demo's
    # app metrics (app_frontend_requests_total, rpc_client_duration_
    # milliseconds_count) actually land after the OTel SDK exports them
    # here over OTLP; phase AS 0A.2 needs 3+ samples inside a [30s] rate()
    # window, which a 30s scrape can't give.
    - port: prometheus
      interval: 10s
