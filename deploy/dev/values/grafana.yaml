# Grafana for the local thump dev environment. Ported from
# ~/projects/ceph/thump-test/applications/infrastructure/grafana/values.yaml
# with the rig's node-affinity rule dropped (no control-plane taint to avoid
# here — deploy/dev/k3d.yaml's k3d nodes carry no such taint) and reached via
# Tilt port_forward instead of a hostname/Ingress.
adminPassword: "admin"

grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false

service:
  type: ClusterIP
  port: 80

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
  datasources:
    enabled: true
    label: grafana_datasource
    labelValue: "1"

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: true
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.tracing.svc.cluster.local:3100
        editable: true
      - name: Loki
        type: loki
        uid: loki
        # Loki's own gateway is disabled (values/loki.yaml), so this is the
        # SingleBinary Service directly — same target promtail's client
        # pushes to.
        url: http://loki.logging.svc.cluster.local:3100
        editable: true
        jsonData:
          derivedFields:
            # otelc's slog hook already injects trace_id via
            # tracing.TraceIDFromFingerprint, so any log line carries the
            # trace of the incident that produced it — one click from a log
            # line to its Tempo trace, no correlation step in between.
            - datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              name: TraceID
              url: "${__value.raw}"

alerting: {}

persistence:
  enabled: false # dashboards loaded from ConfigMaps; nothing to persist

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
